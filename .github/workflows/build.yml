name: Build Java Jar
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Compile and Package Mod
        run: |
          mkdir -p src/main/java/ru/qwalsss/chatmod
          mkdir -p build/classes
          mv ChatModInitializer.java src/main/java/ru/qwalsss/chatmod/
          
          # Компилируем напрямую (без внешних зависимостей, глуша варнинги)
          javac src/main/java/ru/qwalsss/chatmod/ChatModInitializer.java -d build/classes || echo "Ignore compile warnings"
          
          cp fabric.mod.json build/classes/
          cd build/classes
          jar cvf ../../qwalsss-chatmod-1.21.11.jar fabric.mod.json ru/

      - name: Upload Finished Jar Mod
        uses: actions/upload-artifact@v4
        with:
          name: qwalsss-chatmod
          path: qwalsss-chatmod-1.21.11.jar
